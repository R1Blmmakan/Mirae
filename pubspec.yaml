name: mirae
description: "Projek Flutter buat bulan maret. 💔🥀"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  animated_text_kit: ^4.3.0
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  simple_animations: ^5.2.0
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
  - assets/icon/
  - assets/img/
  - assets/lottie/


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

