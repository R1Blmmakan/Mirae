name: mirae
description: "Projek Flutter buat bulan maret. 💔🥀"
publish_to: 'none'
version: 1.0.0-release

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  animated_text_kit: ^4.3.0
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  simple_animations: ^5.2.0
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0 
  flutter_native_splash: ^2.4.0


flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/icon_main.png

  android_12:
    color: "#FFFFFF"
    image: assets/icons/icon_main.png

flutter:
  uses-material-design: true
  assets:
  - assets/icons/
  - assets/img/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"

  adaptive_icon:
    foreground_image_path: "assets/icons/icon.png"
    background_color: "#FFFFFF"

